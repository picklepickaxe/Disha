#ob .s1 .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#1a100d 0%,rgba(26,16,13,.97) 6%,rgba(26,16,13,.88) 14%,rgba(26,16,13,.7) 22%,rgba(26,16,13,.45) 30%,rgba(26,16,13,.2) 38%,rgba(26,16,13,.06) 46%,rgba(26,16,13,0) 54%)}
#ob .s2{background:radial-gradient(ellipse at 78% 35%,#3a1512 0%,#1a100d 60%)}
#ob .s2 svg{position:absolute;right:0;top:0;width:58%;height:100%}
#ob .copy{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:2rem}
#ob .s0 .copy{right:6vw;width:min(40vw,560px)}#ob .s1 .copy{left:6vw;width:min(30vw,520px)}#ob .s2 .copy{left:7vw;width:min(44vw,600px)}
#ob h1{margin:0;font:800 clamp(1.8rem,3.3vw,3.3rem)/1.25 Mukta,sans-serif;text-shadow:0 2px 18px rgba(0,0,0,.35)}
#ob .s2 h1{font-size:clamp(2.4rem,5vw,5rem);line-height:1.1}
#ob em{font-style:normal;color:#e8322f}
#ob .w{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(8px);animation:appear 1.1s calc(.3s + var(--i)*.09s) cubic-bezier(.2,.7,.2,1) forwards}

#ob .br{display:block;height:.55em}#ob .s2 .br{height:0}
#ob .obb{font:800 1.15rem Mukta;letter-spacing:.04em;color:#fff;background:#a5332e;border:0;border-radius:999px;padding:.9rem 2.4rem;cursor:pointer;opacity:0;animation:fade .8s 2.4s forwards}
#ob .skip{position:absolute;top:calc(1.4rem + env(safe-area-inset-top,0px));right:6vw;z-index:2;background:none;border:0;border-bottom:2px solid #e8322f;color:#fff;font:800 .95rem Mukta;padding:0 0 .2rem;cursor:pointer;opacity:0;animation:fade .8s .8s forwards}
#ob .brand{position:absolute;top:calc(1.4rem + env(safe-area-inset-top,0px));left:6vw;z-index:2;font:400 1.7rem "Dela Gothic One",Mukta,sans-serif}#ob .brand i{color:#e8322f;font-style:normal}
#ob .od{display:flex;gap:.5rem}#ob .od i{width:.5rem;height:.5rem;border-radius:50%;background:rgba(255,255,255,.4)}#ob .od i.on{width:1.6rem;border-radius:1rem;background:#fff}
#ob .path{fill:none;stroke:#e8322f;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s .5s cubic-bezier(.6,0,.3,1) forwards}
#ob .faint{stroke:rgba(255,255,255,.16);stroke-width:2;stroke-dasharray:2 14;stroke-dashoffset:0;animation:none}
#ob .pin{fill:#e8322f;opacity:0;transform-origin:center;transform-box:fill-box;animation:pop .6s 3s ease forwards}
@keyframes appear{to{opacity:1;filter:blur(0);transform:none}}@keyframes fade{to{opacity:1}}@keyframes ul{to{transform:scaleX(1)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}

function askMatches(question){
const stop=new Set(['what','which','how','can','the','a','an','is','for','me','my','do','i','to','of','and','in','become','want','learn','job','work','career','hai','kya','ka','ki','के','का','की','है','क्या','मुझे','और','में','से','को']);
const tokens=(question.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[]).filter(x=>x.length>1&&!stop.has(x));
const aliases={elec:'electrician solar wiring electrician बिजली इलेक्ट्रिशियन सोलर',nurse:'nurse nursing hospital नर्स अस्पताल',teach:'teacher teaching स्कूल शिक्षक',agri:'farm agriculture drone किसान खेती कृषि',tailor:'tailor sewing stitch boutique दर्ज़ी सिलाई',digi:'mobile csc digital computer मोबाइल डिजिटल कंप्यूटर',auto:'mechanic bike auto मैकेनिक',retail:'shop retail sales दुकान',beauty:'beautician salon beauty ब्यूटी पार्लर',naps:'naps apprenticeship apprentice अप्रेंटिसशिप'};
const candidates=[
...C.map(c=>({kind:'career',id:c.id,name:T(c.n),text:[T(c.n),...(c.s||[]).map(T),T(c.w),aliases[c.id]||'', 'salary income pay earnings monthly कमाई वेतन नौकरी career काम'].join(' '),item:c})),
...SC.map((s,i)=>({kind:'scheme',id:String(i),name:T(s.n),text:[T(s.n),T(s.d),T(s.r),'scholarship stipend training fees योजना स्कॉलरशिप वज़ीफ़ा'].join(' '),item:s}))
];
const scored=candidates.map(c=>({...c,score:tokens.reduce((n,w)=>n+(c.text.toLowerCase().includes(w)?(c.name.toLowerCase().includes(w)?3:1):0),0)})).filter(c=>c.score>0).sort((a,b)=>b.score-a.score);
return scored.filter(c=>c.score>=scored[0].score-1).slice(0,2);
}

function selectProfileText(value){
const q=Q[S.q],text=value.toLowerCase(),tokens=text.match(/[\p{L}\p{N}]+/gu)||[];
const extras={likes:{fix:'repair mechanic fix electrician चीज़ें ठीक',grow:'farm plants animal खेती पौधे',make:'sew sewing draw stitch सिलाई',talk:'sell shop sales बेच',care:'teach help care सेवा पढ़ाना',num:'computer math number हिसाब कंप्यूटर'},cls:{'9':'class 9 10 ninth tenth दसवीं','11':'class 11 12 eleventh twelfth बारहवीं',g:'college graduate स्नातक',d:'dropout left school छोड़'},cat:{gen:'general सामान्य',obc:'obc',sc:'sc',st:'st'},inc:{lo:'under 2.5 lakh less than 2.5 कम',mid:'2.5 5 lakh 8 lakh मध्यम',hi:'above 8 lakh ज़्यादा'},girl:{g:'woman female लड़की',b:'man male लड़का'},move:{y:'yes हाँ जा सकता can move',n:'no नहीं गाँव village stay'}};
const ranked=q.o.map(o=>{const terms=(o.k+' '+T(o.l)+' '+(extras[q.id]?.[o.v]||'')).toLowerCase().match(/[\p{L}\p{N}]+/gu)||[];let score=0;for(const term of terms)if(term.length>1&&(text.includes(term)||tokens.includes(term)))score+=term.length>3?2:1;
if(q.id==='inc'){const match=text.match(/\b(\d+(?:\.\d+)?)\s*(lakh|lac|लाख)\b/);if(match){const amount=Number(match[1]);if(o.v==='lo'&&amount<2.5||o.v==='mid'&&amount>=2.5&&amount<=8||o.v==='hi'&&amount>8)score+=5}}
return {o,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
if(!ranked.length)return toast(T(['समझ नहीं आया। नीचे दिए विकल्प चुनें या अलग शब्दों में लिखें।','I could not match that. Choose an option below or try different words.']));
if(q.m)ranked.forEach(({o})=>{if(!S.p.likes.includes(o.v))S.p.likes.push(o.v)});else S.p[q.id]=ranked[0].o.v;
if(q.m)render();else next();
}
function typeProfile(){const el=$('#profileText');if(el)selectProfileText(el.value.trim())}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast(T(['इस फ़ोन पर बोलना नहीं चलता, छूकर चुनो','Voice input is not available here, please tap']));
const r=new R();r.lang=S.L?'en-IN':'hi-IN';r.onresult=e=>selectProfileText(e.results[0][0].transcript);r.onerror=()=>toast(T(['माइक नहीं चला, छूकर चुनो','Mic did not work, please tap']));try{r.start();toast(T(['सुन रहा हूँ…','Listening…']))}catch(e){toast(T(['माइक शुरू नहीं हुआ। नीचे लिखो या विकल्प चुनो।','The microphone could not start. Type below or choose an option.']))}}
function askMic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast(T(['इस फ़ोन पर बोलना नहीं चलता, सवाल लिखें।','Voice input is not available here; type your question.']));
const r=new R();r.lang=S.L?'en-IN':'hi-IN';r.onresult=e=>{S.askQ=e.results[0][0].transcript;S.askResult=answerDisha(S.askQ);render()};r.onerror=()=>toast(T(['माइक नहीं चला, सवाल लिखें।','Microphone failed; type your question.']));try{r.start();toast(T(['सुन रहा हूँ…','Listening…']))}catch(e){toast(T(['माइक शुरू नहीं हुआ। सवाल लिखें।','The microphone could not start. Type your question.']))}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='lang'){S.L=+v;S.started=1;S.ob=0;render()}else if(a==='obnext'){S.ob++;if(S.ob>2){S.started=2;S.v='home';render();say(T(['नमस्ते, मैं दिशा हूँ।','Hello, I am Disha.']))}else render()}else if(a==='obskip'){S.started=2;S.v='home';render()}else if(a==='replay'){S.started=1;S.ob=0;render()}else if(a==='fpause'){FP=!FP;b.textContent=FP?T(['तथ्य चलाओ','Resume facts']):T(['तथ्य रोको','Pause facts']);showFact();facts()}
else if(a==='tl'){S.L=1-S.L;render()}
else if(a==='mute'){S.mute=!S.mute;if(S.mute&&window.speechSynthesis)speechSynthesis.cancel();render()}
else if(a==='mode'){S.mode=S.mode==='S'?'T':'S';S.v=S.mode==='S'?'home':'cls';render()}
else if(a==='go'){S.v=v;if(v==='disc'){S.q=0;S.p={likes:[]};S.who=null}render();say(S.v==='disc'?T(Q[0].q):said)}
else if(a==='start'){S.v='disc';S.q=0;S.p={likes:[]};render();say(T(Q[0].q))}
else if(a==='pick')pick(v);else if(a==='next')next();else if(a==='back'){S.q=Math.max(0,S.q-1);render()}
else if(a==='mic')mic();else if(a==='say')say(v||said,1);
else if(a==='typed')typeProfile()
else if(a==='ask'){S.askQ=$('#askQ')?.value.trim()||'';if(!S.askQ)return toast(T(['पहले सवाल लिखें।','Type a question first.']));S.askResult=answerDisha(S.askQ);render()}
else if(a==='askmic')askMic()
else if(a==='sayc'){const c=C.find(x=>x.id===v);say(T(c.n)+'. '+earn(c),1)}
else if(a==='career'){S.c=v;S.v='path';render();say(said)}
else if(a==='apply'){qpush('apply:'+T(SC[+v].n))}
else if(a==='help'){qpush('human_help:'+(+v>=0?T(SC[+v].n):cur()?cur().id:'general'));toast(T(['एक जानकार आपसे संपर्क करेगा।','An expert will contact you.']))}
else if(a==='intro'){qpush('intro:'+MN[+v][1])}else if(a==='join'){qpush('join_group:'+v)}
else if(a==='worry'){const c=cur();const t={pay:T(['हर महीने कमाई: ','Monthly pay: '])+earn(c),safe:T(c.w),stat:T(c.w)};$('#wa').innerHTML=`<div class="card"><p>${t[v]}</p>${spk(t[v])}</div>`;say(t[v],1)}
else if(a==='addst'){const n=($('#nm').value||'').trim();S.pendingState=$('#studentState')?.value||'';S.pendingResistance=$('#studentResistance')?.value||'';if(!n)return toast(T(['नाम लिखो','Write a name']));if(!S.pendingState||!S.pendingResistance)return toast(T(['राज्य और परिवार की चिंता चुनें।','Choose a state and the family’s main concern.']));S.who=n;S.v='disc';S.q=0;S.p={likes:[]};render();say(T(Q[0].q))}
else if(a==='flag'){S.st[+v].f=S.st[+v].f?0:1;render()}
else if(a==='rec'){S.st[+v].r=1;qpush('recommend:'+S.st[+v].n);render()}
else if(a==='addmod'){const t=($('#mt').value||'').trim(),content=($('#mc').value||'').trim(),kind=$('#mk').value,price=Number($('#mp').value);if(!t||!content)return toast(T(['शीर्षक और पाठ सामग्री दोनों लिखें।','Enter both a title and lesson content.']));if(!Number.isFinite(price)||price<0||kind!=='f'&&price<=0)return toast(T(['कीमत सही लिखें।','Enter a valid price.']));S.mods.push({id:'created-'+Date.now(),t,k:kind,p:price,content,career:cur()?.id||'elec'});render();toast(T(['मॉड्यूल सहेजा गया।','Module saved.']))}
else if(a==='openmod'){const m=modules().find(x=>x.id===v);if(!m)return toast(T(['मॉड्यूल नहीं मिला।','Module not found.']));if(m.price&&!(S.paidModules||[]).includes(m.id)){S.payTarget=m.id;S.v='pay'}else S.openModule=m.id;render()}
else if(a==='closemod'){S.openModule=null;render()}
else if(a==='payconfirm'){if(!S.paidModules.includes(S.payTarget))S.paidModules.push(S.payTarget);S.openModule=S.payTarget;S.payTarget=null;S.v='mods';render();toast(T(['डेमो अनलॉक हुआ—कोई भुगतान नहीं लिया गया।','Demo unlocked—no payment was charged.']))}
else if(a==='opportunity'){const o=OPPS.find(x=>x.id===v);if(o&&!S.opportunityInterests.includes(v)){S.opportunityInterests.push(v);save()}toast(T(['रुचि इस डिवाइस पर सहेजी गई; सूची नमूना है, आयोजक से सीधे पुष्टि करें।','Interest saved on this device. This is a sample listing; contact the host to confirm.']))}
else if(a==='partnerSubmit'){const name=$('#partnerName')?.value.trim()||'',org=$('#partnerOrg')?.value.trim()||'',contact=$('#partnerContact')?.value.trim()||'';if(!name||!org||!contact)return toast(T(['नाम, संस्था और संपर्क जानकारी भरें।','Enter your name, organisation and contact details.']));S.partners.push({role:$('#partnerRole').value,name,org,contact,state:$('#partnerState').value});save();render();toast(T(['परिचय इस डिवाइस पर सहेजा गया; अभी किसी संस्था को नहीं भेजा गया।','Introduction saved on this device; it has not been sent to an organisation.']))}
});
document.addEventListener('change',e=>{if(e.target.id==='missionState'){S.missionState=e.target.value;render()}});
window.addEventListener('online',()=>{const n=S.qu.length;S.qu=[];save();bar();if(n)toast(n+T([' चीज़ें भेज दी गईं।',' items sent.']))});window.addEventListener('offline',bar);
render();
</script></body></html>
